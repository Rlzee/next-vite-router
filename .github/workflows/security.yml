name: Security

# Dependency advisories are published on the maintainer's schedule, not the repo's:
# an advisory for a version that has been installed for months first appears in a
# normal push weeks later. The schedule gives the same check a heartbeat between
# changes, and `workflow_dispatch` lets it be run by hand while triaging.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# The audit reads tracked manifests and writes nothing back, and `GITHUB_TOKEN` is
# scoped per job, so the narrowest grant that still lets it run is read-only
# contents. Same reasoning for the compatibility workflow next to this one.
permissions:
  contents: read

jobs:
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `pnpm audit` resolves the graph from `pnpm-lock.yaml` and the registry, so
      # there is no `pnpm install` here: the check costs seconds and cannot be
      # greened or masked by whatever happens to be in a local `node_modules`.
      - name: Audit what an install pulls in (high and above)
        # The shipped graph: `dependencies`, peer dependencies, and the workspace
        # members' dependencies - everything a consumer of this package can end up
        # running. A high here is a finding against the published artifact, so it
        # fails the job and blocks the pull request.
        run: pnpm audit --prod --audit-level=high

      - name: Audit the whole graph at critical
        run: pnpm audit --audit-level=critical

      - name: Report every advisory (informational)
        # Deliberately non-blocking, and the reason is the compatibility mandate:
        # the suites install the declared floors of React, React Router and Vite -
        # `react-router-dom@6.30.6` among them - precisely to prove they still work,
        # so a blocking check on every dev-side advisory would be red by design and
        # train everyone to ignore it. The numbers stay in the log, and the two
        # blocking gates above cover what an install actually inherits.
        if: always()
        continue-on-error: true
        run: pnpm audit

      - name: Lockfile is the one an install would honour
        # A resolution dry run: no download, no link, about 0.2 s. It answers whether
        # the committed lockfile still matches the manifests - which is what makes the
        # audit above a statement about a real install rather than about
        # `package.json`. The unit and operating-system jobs then install with
        # `--frozen-lockfile`, so a mismatch cannot reach a green run either way.
        run: pnpm install --frozen-lockfile --lockfile-only --dry-run
