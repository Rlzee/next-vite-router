version: 2

updates:
  # The workspace root's lockfile is the only one in the repository, and it resolves
  # for all three members (`examples/` and `test/browser-app/` included), so one
  # entry covers the shipped runtime graph - `commander`, `kleur`, `prompts` - the
  # build tooling, and the fixture apps' own peers. `workspace:` links are internal
  # and Dependabot skips them.
  - package-ecosystem: pnpm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    # Split so a bump of a shipped dependency is reviewable on its own: `files`
    # publishes `dist` and its dependencies travel to every install, while a dev
    # bump only has to keep the suites green.
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # The `uses:` pins in `.github/workflows` are a supply-chain surface like any
  # other dependency, and nothing else in this configuration updates them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
